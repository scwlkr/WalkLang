name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WALK_RELEASE_VERSION: v6.4.1
    steps:
      - uses: actions/checkout@v6
      - run: make clean
      - run: make walk WALK_VERSION="$WALK_RELEASE_VERSION"
      - run: scripts/check-docs-site.sh
      - run: make release VERSION="$WALK_RELEASE_VERSION" OUT=dist
      - uses: actions/upload-artifact@v7
        with:
          name: walk-${{ env.WALK_RELEASE_VERSION }}
          path: dist/
