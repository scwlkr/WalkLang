name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WALK_RELEASE_VERSION: v6.3.2
    steps:
      - uses: actions/checkout@v6
      - run: make clean
      - run: make walk WALK_VERSION="$WALK_RELEASE_VERSION"
      - run: make test
      - run: make conformance WALK_VERSION="$WALK_RELEASE_VERSION"
      - run: WALK_BIN="$PWD/build/walk" scripts/stress-compatibility.sh
      - run: scripts/check-docs-site.sh
      - run: make release VERSION="$WALK_RELEASE_VERSION" OUT=dist
      - uses: actions/upload-artifact@v7
        with:
          name: walk-${{ env.WALK_RELEASE_VERSION }}
          path: dist/
