name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make clean
      - run: make walk WALK_VERSION=v6.0.0-port-candidate
      - run: make test
      - run: make conformance WALK_VERSION=v6.0.0-port-candidate
      - run: WALK_BIN="$PWD/build/walk" scripts/stress-compatibility.sh
      - run: scripts/check-docs-site.sh
      - run: make release VERSION=v6.0.0-port-candidate OUT=dist
      - uses: actions/upload-artifact@v7
        with:
          name: walk-v6.0.0-port-candidate
          path: dist/
