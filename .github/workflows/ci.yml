name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go build -o build/walk ./cmd/walk
      - run: WALK_BIN="$PWD/build/walk" scripts/stress-v1.sh
      - run: scripts/check-docs-site.sh
      - run: scripts/release.sh v5.13.0 dist
      - uses: actions/upload-artifact@v7
        with:
          name: walk-v5.13.0
          path: dist/
